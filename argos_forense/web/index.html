<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d12">
<meta name="description" content="ARGOS FORENSE — rastreo nacional OSINT de fosas clandestinas, campamentos y casas de seguridad, con cortes históricos cada 72 horas.">
<title>ARGOS FORENSE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23070d12%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%279%27 fill=%27none%27 stroke=%27%233ac9e8%27 stroke-width=%272%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27%233ac9e8%27/%3E%3Cpath d=%27M16 3v4M16 25v4M3 16h4M25 16h4%27 stroke=%27%233ac9e8%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/argos.css">
</head>
<body>

<header class="cabecera">
  <div class="cabecera__barra">
    <div class="marca">
      <span class="marca__nombre">ARGOS <b>FORENSE</b></span>
      <span class="marca__lema">Rastreo nacional OSINT</span>
    </div>
    <div class="cabecera__estado">
      <span class="sello sello--vivo" id="sello-corte" title="Corte vigente">—</span>
      <span class="sello" id="sello-hora" title="Hora de Ciudad de México">—</span>
    </div>
  </div>
  <nav class="menu" id="menu" aria-label="Secciones"></nav>
</header>

<main class="contenido" id="vista" role="main" aria-live="polite">
  <div class="cargando">Cargando ARGOS FORENSE…</div>
</main>

<div class="velo" id="velo" hidden role="dialog" aria-modal="true" aria-labelledby="dialogo-titulo">
  <div class="dialogo">
    <div class="dialogo__cabeza">
      <h2 id="dialogo-titulo">—</h2>
      <button class="dialogo__cerrar" id="dialogo-cerrar" aria-label="Cerrar">×</button>
    </div>
    <div class="dialogo__cuerpo" id="dialogo-cuerpo"></div>
    <div class="dialogo__pie" id="dialogo-pie"></div>
  </div>
</div>

<div class="aviso-flotante" id="aviso-flotante" hidden role="status"></div>

<!-- Leaflet local: la plataforma no depende de una CDN para dibujar el mapa. -->
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/util.js"></script>
<script src="/js/api.js"></script>
<script src="/js/mapa.js"></script>
<script src="/js/vistas-operacion.js"></script>
<script src="/js/vistas-catalogos.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
